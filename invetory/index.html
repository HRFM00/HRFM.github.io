<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセス用QRコード</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; background: #f7f7f7; }
        .container { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 20px; }
        h1 { margin: 0 0 16px; font-size: 20px; }
        .qrcode-wrap { display: grid; place-items: center; padding: 16px; border: 1px dashed #ddd; border-radius: 8px; background: #fafafa; }
        .qrcode-wrap img { width: 260px; height: 260px; object-fit: contain; }
        .hint { margin-top: 12px; color: #666; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>以下のサイトにアクセスしてください</h1>
        <div class="qrcode-wrap">
            <img src="QR.png" alt="アクセス用QRコード">
        </div>
        <div class="hint">QRコードが読み取れない場合はアドレスバーに直接入力してください。</div>
    </div>
    
</body>
</html>
